[workspace]
members = [
    "nfs-klldap-config",
    "nfs-klldap-ui",
]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
authors = ["Aelieth"]
license = "MIT"
repository = "https://github.com/aelieth/nfs-klldap-host"

[workspace.dependencies]
# Shared dependencies (and dev-dependencies) used by both workspace members.
# This centralizes version management and makes it easy to keep the two crates
# in sync. Use `foo = { workspace = true }` (or with extra features) in member
# manifests.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tempfile = "3"

# =============================================================================
# nfs-klldap-host Cargo Workspace
# =============================================================================
#
# Primary crates (both ship inside the nfs-klldap-host container):
#
#   nfs-klldap-ui/         → The in-container WebUI (Axum + HTMX) on port 9630.
#                            Binary: nfs-klldap-ui
#                            Depends on nfs-klldap-config for TOML handling.
#
#   nfs-klldap-config/     → Tiny, focused library + two binaries:
#                            * nfs-klldap-config   (generator used by entrypoint + watcher)
#                            * nfs-klldap-startup  (guided first-run + diagnostics)
#
# Workspace-level metadata (version, edition, authors, license, repository)
# is defined once in [workspace.package] and inherited via `version.workspace = true`.
#
# Shared dependency versions are centralized in [workspace.dependencies].
# Member crates reference them with `foo = { workspace = true }`.
# This is the modern, recommended pattern for multi-crate workspaces.
#
# Root workspace commands (as used by Makefile):
#     cargo build --workspace
#     cargo test --workspace
#     cargo clippy --workspace ...
#
# There is no [package] at the root — this is a pure workspace definition.
# =============================================================================
