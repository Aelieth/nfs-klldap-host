[workspace]
members = [
    "nfs-klldap-identity",
    "nfs-klldap-config",
    "nfs-klldap-ui",
]
resolver = "2"

[workspace.package]
version = "0.9.1"
edition = "2021"
authors = ["Aelieth"]
license = "MIT"
repository = "https://github.com/aelieth/nfs-klldap-host"

[workspace.dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tempfile = "3"

# Cross-cutting
thiserror = "2.0"
time = { version = "0.3" }
rand = "0.8"
urlencoding = "2"
tower = { version = "0.4" }
walkdir = "2"
nix = { version = "0.29", features = ["process", "signal"] }
signal-hook = "0.3"

toml_edit = "0.22"

# Async / web
tokio = { version = "1.52" }
axum = { version = "0.7" }
askama = { version = "0.12" }
askama_axum = "0.4"

# TLS + LDAP (ring for early CryptoProvider + reliable LDAPS)
rustls = { version = "0.23", default-features = false, features = ["ring"] }
ldap3 = { version = "0.12", default-features = false }

# Local auth
cookie = "0.18"
sha2 = "0.10"
subtle = "2.6"
