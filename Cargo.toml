[workspace]
members = [
    "nfs-klldap-config",
    "nfs-klldap-ui",
]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2021"
authors = ["Aelieth"]
license = "MIT"
repository = "https://github.com/aelieth/nfs-klldap-host"

[workspace.dependencies]
# Central registry for dependency versions (single source of truth).

# --- Core shared (used by both crates today) ---------------------------------
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tempfile = "3"

# --- Small cross-cutting utilities -------------------------------------------
thiserror = "2.0"
time = { version = "0.3" }  # kept for rcgen cert validity dates in the UI (and transitively via cookie/rcgen)
rand = "0.8"
libc = "0.2"
urlencoding = "2"
tower = { version = "0.4" }   # only used in dev-deps for tests today

# --- TOML editing (comment-preserving raw editor in the WebUI) ---------------
toml_edit = "0.22"

# --- Async runtime -----------------------------------------------------------
tokio = { version = "1.52" }

# --- Web framework + templating ----------------------------------------------
axum = { version = "0.7" }
askama = { version = "0.12" }
askama_axum = "0.4"
hyper-util = { version = "0.1" }

# --- TLS (HTTPS listener + outbound LDAPS via ldap3) -------------------------
rustls-native-certs = "0.8"

# --- LDAP client -------------------------------------------------------------
ldap3 = { version = "0.12", default-features = false }

# --- Local auth sidecar + misc -----------------------------------------------
cookie = "0.18"
sha2 = "0.10"
subtle = "2.6"

# Primary crates: nfs-klldap-ui (WebUI on 9630) + nfs-klldap-config (generator + startup).
