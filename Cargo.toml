[workspace]
members = [
    "nfs-klldap-config",
    "nfs-klldap-ui",
]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2021"
authors = ["Aelieth"]
license = "MIT"
repository = "https://github.com/aelieth/nfs-klldap-host"

[workspace.dependencies]
# =============================================================================
# Central registry for *all* dependency versions in this workspace.
#
# Goal: single source of truth so versions are bumped in exactly one place,
#       preventing skew and duplication of version strings across member crates.
#
# Usage in members:
#   foo = { workspace = true }                    # plain
#   foo = { workspace = true, features = ["x"] }  # extend features
#   foo = { workspace = true, default-features = false, features = ["bar"] }
#
# The two member crates have very different profiles:
#   - nfs-klldap-config  → tiny, no heavy async/crypto/web stack (by design)
#   - nfs-klldap-ui      → full web UI + LDAPS client + TLS cert handling
#
# We still register every crate here for maintainability. The config crate
# simply does not list most of them in its [dependencies].
# =============================================================================

# --- Core shared (used by both crates today) ---------------------------------
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tempfile = "3"
# NOTE: serde_json was removed after a full audit (zero actual uses anywhere in the tree).
#       hyper-util was also removed from direct UI deps (axum + axum-server provide it).

# --- Small cross-cutting utilities -------------------------------------------
thiserror = "2.0"
time = { version = "0.3" }  # kept for rcgen cert validity dates in the UI (and transitively via cookie/rcgen)
rand = "0.8"
libc = "0.2"
urlencoding = "2"
tower = { version = "0.4" }   # only used in dev-deps for tests today

# --- TOML editing (comment-preserving raw editor in the WebUI) ---------------
toml_edit = "0.22"

# --- Async runtime -----------------------------------------------------------
tokio = { version = "1.52" }

# --- Web framework + templating ----------------------------------------------
axum = { version = "0.7" }
askama = { version = "0.12" }
askama_axum = "0.4"
hyper-util = { version = "0.1" }

# --- TLS configuration -------------------------------------------------------
# The WebUI serves HTTPS directly on 9630 using axum-server + rustls.
# Outbound LDAPS / StartTLS to KLLDAP uses the ldap3 client (see below).
# Prefers rustls to match the reliable TLS stack used by the axum-server WebUI
# and the old working client. Self-signed setups are supported.

# --- LDAP client -------------------------------------------------------------
# Outbound LDAPS / StartTLS client to KLLDAP. Uses rustls exclusively
# (tls-rustls-ring) for compatibility with the WebUI's own TLS stack and
# reliable operation against self-signed KLLDAP. Supports ldap_tls_reqcert=never
# or custom CA bundles via ldap_tls_cacert.
ldap3 = { version = "0.12", default-features = false }

# --- Local auth sidecar + misc -----------------------------------------------
cookie = "0.18"
sha2 = "0.10"
subtle = "2.6"

# =============================================================================
# Workspace notes
# =============================================================================
# Primary crates (both ship inside the nfs-klldap-host container):
#   - nfs-klldap-ui        (the WebUI on 9630)
#   - nfs-klldap-config    (tiny generator + guided startup binary)
#
# Workspace metadata lives in [workspace.package].
# All dependency versions live in [workspace.dependencies] (see above).
# Member crates inherit with `{ workspace = true }` (plus features when needed).
#
# The config crate is intentionally minimal and does not pull most of the
# async/web/TLS crates registered here.
# =============================================================================
