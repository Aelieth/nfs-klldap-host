# nfs-klldap: Navahi mDNS advertisement (static services only).
# The pid-1 supervisor runs `avahi-daemon --no-chroot` only while
# navahi_discovery = true in nfs-klldap.conf; the adverts are the generated
# /etc/avahi/services/nfs-klldap-*.service files (inotify-reloaded, plus a
# supervisor SIGHUP belt after each regenerate).

[server]
# Static XML publishing needs no D-Bus API, and the daemon must not couple
# its lifetime to the (ganesha-owned) system bus.
enable-dbus=no
use-ipv4=yes
use-ipv6=yes

[publish]
# Publish exactly the generated per-share service files, nothing else.
publish-hinfo=no
publish-workstation=no
