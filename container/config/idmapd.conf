#
# /etc/idmapd.conf - NFSv4 ID mapping configuration
#
# For Kerberized NFS with user-only tickets + LDAP/SSSD, this is critical.
#
# Recommended: Method = sss   (when using sssd-nfs-idmap)
# Alternative: Method = nsswitch  (if you prefer nsswitch + files sss)
#

[General]
# Must match your Kerberos realm (and usually your DNS domain)
Domain = EXAMPLE.COM

# Optional but recommended
Local-Realms = EXAMPLE.COM

[Mapping]
Nobody-User = nobody
Nobody-Group = nobody

[Translation]
# Primary recommendation when sssd-nfs-idmap is installed:
Method = sss

# If you want fallback or are using legacy nslcd path:
# Method = nsswitch

# You can list multiple methods if desired:
# Method = sss,nsswitch
