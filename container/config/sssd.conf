#
# SSSD configuration for LLDAP + NFSv4 idmapping (AlmaLinux 10 container)
#
# This is a TEMPLATE. Copy and customize for your environment, then bind-mount
# as /etc/sssd/sssd.conf inside the container (mode 0600, root:root).
#
# Key points for NFS idmapping:
#   - Use the sss provider for passwd/group
#   - Enable the sss plugin in idmapd.conf (Method = sss)
#   - LLDAP must have posixAccount + posixGroup objectClasses with uidNumber/gidNumber
#

[domain/default]
id_provider = ldap
auth_provider = ldap
chpass_provider = ldap
access_provider = permit          # Adjust later (e.g. ldap, simple, or custom)

# LLDAP connection (use LDAPS when possible)
ldap_uri = ldaps://lldap.example.com:6360
ldap_search_base = dc=example,dc=com

# DIT layout commonly used with LLDAP
ldap_user_search_base = ou=people,dc=example,dc=com
ldap_group_search_base = ou=groups,dc=example,dc=com

# Object classes and attributes (LLDAP defaults + POSIX)
ldap_user_object_class = inetOrgPerson
ldap_user_name = uid
ldap_user_uid_number = uidNumber
ldap_user_gid_number = gidNumber
ldap_user_home_directory = homeDirectory
ldap_user_shell = loginShell

ldap_group_object_class = posixGroup
ldap_group_name = cn
ldap_group_gid_number = gidNumber
ldap_group_member = memberUid

# TLS / certificate handling
ldap_tls_reqcert = demand
# ldap_tls_cacert = /etc/ssl/certs/ca-bundle.crt   # or bind-mount your CA
# ldap_tls_cacertdir = /etc/pki/tls/certs

# Optional: bind DN if LLDAP requires authentication for searches
# ldap_default_bind_dn = uid=binduser,ou=people,dc=example,dc=com
# ldap_default_authtok = secret   # Better: use a secret mounted at runtime

# Performance / caching suitable for NFS
enumerate = true                  # Useful for small environments and idmapping
cache_credentials = true
ldap_enumeration_refresh_timeout = 300
ldap_purge_cache_timeout = 3600

# NFS-specific: allow the nfs service to query SSSD for idmapping
ldap_access_order = expire
ldap_account_expire_policy = ldap_exop

[sssd]
config_file_version = 2
services = nss, pam
domains = default

# Optional: increase debug level during initial setup (0-10)
# debug_level = 7

[nss]
filter_groups = root
filter_users = root
reconnection_retries = 3

[pam]
reconnection_retries = 3
