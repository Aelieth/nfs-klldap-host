# Recommended compose for nfs-klldap-host (Ganesha only).
# Single source of truth: nfs-klldap.conf. In-container WebUI on HTTPS port 9630.
# cap_add for SYS_ADMIN + DAC_READ_SEARCH is strongly recommended (see docs/run/README.md).

# Compose service name is nfs-kerb; container_name is nfs-klldap-host (use either in docker commands).

services:
  nfs-kerb:
    build:
      context: ..
      dockerfile: Dockerfile
    image: nfs-klldap-host:latest
    container_name: nfs-klldap-host

    # Host networking required: NFS + Kerberos need host-reachable addresses (not 172.17.x.x bridge).
    network_mode: host
    uts: host

    # SYS_ADMIN + DAC_READ_SEARCH are recommended for reliable Ganesha VFS operation
    # against host bind-mounted trees and for the WebUI's recursive chown/chmod traversal.
    # See docs/run/README.md "Running Ganesha in Docker against the host filesystem".
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH

    volumes:
      # Bind host parent dir(s) to container_root; see docs/ganesha-architecture.md for host_path mapping.
      - /media/:/export:rw
      - ./config:/config:rw
      - ./secrets/krb5.keytab:/etc/krb5.keytab:ro

    environment:
      # Optional env overrides for core nfs-klldap.conf options (env wins; only NFS_KLLDAP_* prefixed forms).
      # See root README "Environment Variables" section for the full table (with defaults/examples).
      # Common ones: NFS_KLLDAP_KERBEROS_REALM, NFS_KLLDAP_WEBUI_TLS=off for reverse proxy.
      # - NFS_KLLDAP_LDAP_URI=ldaps://...
      # - NFS_KLLDAP_SSSD_LDAP_DEFAULT_BIND_DN=...
      # - NFS_KLLDAP_SSSD_LDAP_DEFAULT_AUTHTOK=...
      # - NFS_KLLDAP_KERBEROS_REALM=YOUR.REALM
      # - NFS_KLLDAP_WEBUI_TLS=off

    restart: unless-stopped

# WebUI: https://<host>:9630
# Reload config: docker kill -s HUP nfs-klldap-host
# See docs/run/README.md for keytab principals and uts: host.