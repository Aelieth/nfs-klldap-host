# =============================================================================
# Example docker-compose.yml for alma_nfs-kerb (Ganesha / user-space NFS ONLY)
#
# This is the recommended (and now only supported) configuration.
#
# The container itself is the complete Kerberized NFSv4 server using
# NFS-Ganesha (user-space) + SSSD for LLDAP POSIX UID/GID mapping.
#
# The host does NOT need kernel NFS modules (nfs, nfsd, rpcsec_gss_krb5).
# This makes it suitable for ZimaOS, TrueNAS SCALE, minimal appliances,
# or any Linux machine that can't or won't run a full NFS stack.
# =============================================================================
version: "3.8"

services:
  nfs-kerb:
    build:
      context: ..
      dockerfile: Dockerfile
    image: alma-nfs-kerb:latest
    container_name: alma-nfs-kerb

    # Host networking is often simplest for NFS (especially with Kerberos + DNS).
    # You can also publish ports explicitly if you prefer.
    network_mode: host

    # Ganesha (VFS FSAL) needs certain privileges to export host bind-mounted
    # directories and manipulate file handles.
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
      # - SYS_RESOURCE   # sometimes helpful for large numbers of exports

    # Optional but recommended for some environments:
    # privileged: true

    hostname: nfs-server-01.example.com   # MUST match the NFS principal in the keytab

    volumes:
      # ---------------------------------------------------------------------
      # Storage (the only data volume in the new minimal model)
      # Mount whatever media drives you want under /export inside the container.
      # The numeric uid/gid on the host **must** match KLLDAP uidNumber/gidNumber.
      # ---------------------------------------------------------------------
      - /media/SSD-01:/export:rw

      # ---------------------------------------------------------------------
      # The single source of truth (shared with the host UI)
      # The host-side `nfs-klldap-ui` edits this file directly.
      # The container's Rust generator watches it (or reacts to SIGHUP) and
      # regenerates sssd.conf / krb5.conf / Ganesha fragments.
      # ---------------------------------------------------------------------
      - ./config:/config:rw

      # ---------------------------------------------------------------------
      # Kerberos keytab (ro)
      # ---------------------------------------------------------------------
      - ./secrets/krb5.keytab:/etc/krb5.keytab:ro

      # No templates/ or ganesha-exports.d bind mounts are needed in the
      # standard v0.23+ flow — everything is derived from nfs-klldap.conf.

    environment:
      # No mandatory variables. Everything is driven by templates + files.
      #
      # You can still pass variables that will be expanded inside templates:
      # - REALM=YOUR.REALM
      # - MY_LDAP_HOST=lldap.example.com
      #
      # The management tool (or operators) can send SIGHUP for a simple reload:
      #   docker kill -s HUP alma-nfs-kerb
      #
      # Preferred method is direct control via ganesha-ctl (see README).

    restart: unless-stopped

    # The healthcheck is defined in the Dockerfile and uses container/healthcheck.sh
    # It verifies: ganesha.nfsd process + listening on 2049 + basic responsiveness.

# =============================================================================
# Notes for the host-side tools
#
# Build everything with the top-level Makefile:
#
#     make build                 # native
#     make dist                  # cross-compiled amd64 + arm64 binaries in ./dist/
#     make docker-multi          # multi-platform container image
#
# Then run the UI from the host:
#     ./dist/nfs-klldap-ui-amd64 --config ./config/nfs-klldap.conf     # (or the arm64 variant)
#
# The UI has two pages:
#     /settings   → edit the central TOML (raw editor recommended for comments)
#     /           → Share Permissions (tree browser + live KLLDAP + helper for chown/chmod)
#
# After editing shares or settings in the UI, the container will pick up the
# change (via its config watcher or `docker kill -s HUP <container>`).
#
# The privileged helper (`nfs-perm-helper`) **must** be installed on the host
# (not inside the container). It usually needs setuid root or a narrow sudoers
# rule. See `make install-helper` and management/examples/sudoers.example.
# =============================================================================
