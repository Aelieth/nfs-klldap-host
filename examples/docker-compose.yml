# Recommended compose for nfs-klldap-host (Ganesha only).
# Single source of truth: nfs-klldap.conf. In-container WebUI on HTTPS port 9630.
version: "3.8"

services:
  nfs-kerb:
    build:
      context: ..
      dockerfile: Dockerfile
    image: alma-nfs-kerb:latest
    container_name: alma-nfs-kerb

    network_mode: host
    uts: host

    volumes:
      - /media/SSD-01:/export:rw
      - ./config:/config:rw
      - ./secrets/krb5.keytab:/etc/krb5.keytab:ro

    environment:
      # Optional env overrides for core nfs-klldap.conf options (env wins; only NFS_KLLDAP_* prefixed forms).
      # See root README "Environment Variables" section for the full table (with defaults/examples).
      # Common ones: NFS_KLLDAP_KERBEROS_REALM, NFS_KLLDAP_WEBUI_TLS=off for reverse proxy.
      # - NFS_KLLDAP_LDAP_URI=ldaps://...
      # - NFS_KLLDAP_SSSD_LDAP_DEFAULT_BIND_DN=...
      # - NFS_KLLDAP_SSSD_LDAP_DEFAULT_AUTHTOK=...
      # - NFS_KLLDAP_KERBEROS_REALM=YOUR.REALM
      # - NFS_KLLDAP_WEBUI_TLS=off

    restart: unless-stopped

# WebUI: https://<host>:9630
# Reload config: docker kill -s HUP alma-nfs-kerb
# See docs/run/README.md for keytab principals and uts: host.