# =============================================================================
# Example docker-compose.yml for alma_nfs-kerb (Ganesha / user-space NFS ONLY)
#
# This is the recommended (and now only supported) configuration.
#
# The container itself is the complete Kerberized NFSv4 server using
# NFS-Ganesha (user-space) + SSSD for LLDAP POSIX UID/GID mapping.
#
# The host does NOT need kernel NFS modules (nfs, nfsd, rpcsec_gss_krb5).
# This makes it suitable for ZimaOS, TrueNAS SCALE, minimal appliances,
# or any Linux machine that can't or won't run a full NFS stack.
# =============================================================================
version: "3.8"

services:
  nfs-kerb:
    build:
      context: ..
      dockerfile: Dockerfile
    image: alma-nfs-kerb:latest
    container_name: alma-nfs-kerb

    # Host networking is often simplest for NFS (especially with Kerberos + DNS).
    # You can also publish ports explicitly if you prefer.
    network_mode: host

    # Ganesha (VFS FSAL) needs certain privileges to export host bind-mounted
    # directories and manipulate file handles.
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
      # - SYS_RESOURCE   # sometimes helpful for large numbers of exports

    # Optional but recommended for some environments:
    # privileged: true

    hostname: nfs-server-01.example.com   # MUST match the NFS principal in the keytab

    volumes:
      # ---------------------------------------------------------------------
      # Your actual data — bind-mounted from *attached/media drives only*.
      #
      # On ZimaOS (and similar locked-down appliances) there are no "system"
      # export roots like /srv/nfs. All real data lives on attached drives
      # that appear under /media/... or similar paths at runtime.
      #
      # The numeric uid/gid on these directories MUST match the uidNumber/gidNumber
      # values in your LLDAP POSIX attributes for the users/groups that should
      # own the data.
      # ---------------------------------------------------------------------
      - /media/SSD-01/project-alpha:/export/project-alpha:rw
      - /media/SSD-01/backups:/export/backups:rw
      # Add more attached-drive paths as needed...

      # ---------------------------------------------------------------------
      # Ganesha export definitions (NATIVE Ganesha blocks)
      #
      # The management tool writes files here containing EXPORT { ... } blocks.
      # The container's internal ganesha-export-watcher reads them and restarts
      # ganesha.nfsd when they change. No DBUS required.
      # ---------------------------------------------------------------------
      - ./ganesha-exports.d:/etc/ganesha/exports.d:rw

      # ---------------------------------------------------------------------
      # Kerberos keytab + templates can live on an attached drive.
      #
      # Example (if your keytab and templates are on the same SSD as the data):
      #   - /media/SSD-01/secrets/krb5.keytab:/etc/krb5.keytab:ro
      #   - /media/SSD-01/templates:/container/templates:ro
      #
      # Below are the classic "files next to the compose file" locations,
      # which also work fine.
      # ---------------------------------------------------------------------
      - ./secrets/krb5.keytab:/etc/krb5.keytab:ro
      - ./templates:/container/templates:ro

      # ---------------------------------------------------------------------
      # OPTIONAL: direct final configs (these win over templates)
      # ---------------------------------------------------------------------
      # - ./config/sssd.conf:/etc/sssd/sssd.conf:ro
      # - ./config/krb5.conf:/etc/krb5.conf:ro
      # - ./config/ganesha.conf:/etc/ganesha/ganesha.conf:ro

      # ---------------------------------------------------------------------
      # OPTIONAL: CA bundle for LDAPS to LLDAP (if using custom/internal CA)
      # ---------------------------------------------------------------------
      # - ./secrets/ca.crt:/etc/ssl/certs/ca-bundle.crt:ro

      # ---------------------------------------------------------------------
      # No DBUS mount is required.
      #
      # The container is fully self-contained. It runs `ganesha-export-watcher`
      # (inotify) internally. When the management tool (or an admin) writes
      # a new EXPORT fragment into the bind-mounted ./ganesha-exports.d/
      # directory, the watcher detects the change and restarts ganesha.nfsd
      # so the new exports are loaded.
      #
      # This design is required for ZimaOS and other locked-down environments
      # that cannot expose the host DBUS socket or certain internal paths.
      # ---------------------------------------------------------------------

    environment:
      # No mandatory variables. Everything is driven by templates + files.
      #
      # You can still pass variables that will be expanded inside templates:
      # - REALM=YOUR.REALM
      # - MY_LDAP_HOST=lldap.example.com
      #
      # The management tool (or operators) can send SIGHUP for a simple reload:
      #   docker kill -s HUP alma-nfs-kerb
      #
      # Preferred method is direct control via ganesha-ctl (see README).

    restart: unless-stopped

    # The healthcheck is defined in the Dockerfile and uses container/healthcheck.sh
    # It verifies: ganesha.nfsd process + listening on 2049 + basic responsiveness.

# =============================================================================
# Notes for users of the management tool (Rust web UI)
#
# 1. The tool runs on the host (not inside this container).
# 2. It talks to LLDAP over GraphQL to resolve user/group names → uidNumber/gidNumber.
# 3. It uses a tiny privileged helper (sudo or setuid) to do recursive chown/chmod
#    on the host directories so they match LLDAP.
# 4. It writes native Ganesha EXPORT {} blocks into ./ganesha-exports.d/
# 5. It speaks directly to Ganesha inside the container via:
#      docker exec alma-nfs-kerb ganesha-ctl add-export ...
#      docker exec alma-nfs-kerb ganesha-ctl remove-export ...
#
# See management/ for the tool source and configuration.
# =============================================================================
