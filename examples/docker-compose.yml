# Recommended compose for nfs-klldap-host (Ganesha only).
# Single source of truth: nfs-klldap.conf. In-container WebUI on HTTPS port 9630.
# cap_add for SYS_ADMIN + DAC_READ_SEARCH is strongly recommended (see docs/run/README.md).

# Compose service name is nfs-kerb; container_name is nfs-klldap-host (use either in docker commands).

services:
  nfs-kerb:
    build:
      context: ..
      dockerfile: Dockerfile
    # Local-build tag. `make docker` produces git-versioned tags (branch name,
    # e.g. nfs-klldap-host:1.0) — pin one of those for reproducible deploys.
    image: nfs-klldap-host:latest
    container_name: nfs-klldap-host

    # Host networking required: NFS + Kerberos need host-reachable addresses (not 172.17.x.x bridge).
    # Navahi Network Discovery (navahi_discovery = true) also depends on it: mDNS
    # multicast + rpcbind/MOUNT must live on the LAN-visible host. Open the host
    # firewall for 5353/udp (mdns), 111/tcp+udp, 20048/tcp, 2049/tcp — see
    # docs/run/README.md "Navahi network discovery".
    network_mode: host
    uts: host

    # SYS_ADMIN + DAC_READ_SEARCH are recommended for reliable Ganesha VFS operation
    # against host bind-mounted trees and for the WebUI's recursive chown/chmod traversal.
    # See docs/run/README.md "Running Ganesha in Docker against the host filesystem".
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH

    volumes:
      # Bind host parent dir(s) to container_root; see docs/ganesha-architecture.md for host_path mapping.
      - /media/:/export:rw
      - ./config:/config:rw
      - ./secrets/krb5.keytab:/etc/krb5.keytab:ro
      # NFSv4 client recovery state (RecoveryBackend=fs): persists across
      # container recreation so clients reclaim locks/opens through grace.
      - ./ganesha-recovery:/var/lib/nfs/ganesha:rw

    environment:
      # Optional env overrides for core nfs-klldap.conf options (env wins; only NFS_KLLDAP_* prefixed forms).
      # Full table: docs/run/README.md. Common: NFS_KLLDAP_KERBEROS_REALM, NFS_KLLDAP_WEBUI_TLS=off for reverse proxy.
      # - NFS_KLLDAP_LDAP_URI=ldaps://...
      # - NFS_KLLDAP_SSSD_LDAP_DEFAULT_BIND_DN=...
      # - NFS_KLLDAP_SSSD_LDAP_DEFAULT_AUTHTOK=...
      # - NFS_KLLDAP_KERBEROS_REALM=YOUR.REALM
      # - NFS_KLLDAP_WEBUI_TLS=off

      # HOST_NFS mode (host-managed Ganesha): set true and add a volume for the host's /etc/ganesha
      # so generated fragments are consumed by the host NFS server. The container still provides
      # the WebUI, share config, Kerberos client config, and recursive permission management.
      # See docs/run/README.md "HOST_NFS mode".
      # - HOST_NFS=true

    restart: unless-stopped

# Example volume addition for HOST_NFS (add alongside the existing ones):
#    volumes:
#      - /etc/ganesha:/etc/ganesha:rw   # host Ganesha reads our exports.d fragments
#      - /media/SSD-01:/export:rw
#      - ./config:/config:rw
#      - ./secrets/krb5.keytab:/etc/krb5.keytab:ro
#
# The same keytab with nfs/ principals must be visible to the *host* ganesha.nfsd
# (typically at the host's /etc/krb5.keytab). --uts=host is still strongly recommended.

# WebUI: https://<host>:9630
# Graceful apply (shares/exports; identity staged): docker kill -s HUP nfs-klldap-host
# Forced full recycle (all services; applies staged identity): docker kill -s USR1 nfs-klldap-host
# See docs/run/README.md for keytab principals and uts: host.