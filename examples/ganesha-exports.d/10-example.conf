# Reference-only generated Ganesha EXPORT fragment (do not bind-mount exports.d).
# Real fragments are emitted inside the container from nfs-klldap.conf.
# Remove export: docker exec nfs-klldap-host ganesha-ctl remove-export <id>

EXPORT {
    Export_Id = 1001;
    Path = /export/example;
    Pseudo = /example;
    SecType = krb5p;
    Squash = root_squash;
    PrefRead = 1048576;
    PrefWrite = 1048576;

    CLIENT {
        Clients = *;
        Access_Type = RW;
        Protocols = 4;
    }

    FSAL {
        Name = VFS;
    }
}

# Additional CLIENT blocks may be appended manually; not preserved on regeneration.