# =============================================================================
# Example native NFS-Ganesha EXPORT block (for reference only)
#
# In the central TOML model (v0.8+) these files are generated *inside* the
# container by the bundled Rust tool from nfs-klldap.conf.
#
# You normally do not bind-mount ganesha-exports.d from the host.
# This file is kept only so you can see the shape of what the generator emits.
# =============================================================================
#   docker exec nfs-klldap-host ganesha-ctl remove-export <id>
#
# This is the modern, clean way (no more classic kernel /etc/exports).
# =============================================================================

EXPORT {
    # Stable numeric ID for this export. Used for RemoveExport / management.
    # Choose unique values across all your exports (0-60000 range is fine).
    Export_Id = 1001;

    # The real path *inside the container* where the data lives (for the VFS FSAL).
    # Derived via container_path_for from the share's own host_path + container_root:
    #   first directory component of host_path (after leading /) is the implicit per-share
    #   bind root; the tail is the subpath under container_root.
    # Example: host_path="/media/NVME-RAID/nvme" → internal = "/export/NVME-RAID/nvme"
    # (export_path is used only for the client Pseudo / external name and can be short.)
    # Must be visible via the bind(s) declared in compose / docker run.
    Path = /export/example;

    # The path clients see in the NFSv4 pseudo filesystem.
    # This is what appears after the server name in mount commands.
    # Example: mount ... server.example.com:/example /mnt/test
    Pseudo = /example;

    # Strong Kerberos authentication + privacy (integrity + encryption).
    # Clients mount with: -o sec=krb5p
    SecType = krb5p;

    # Strict NFSv4+ only (Ganesha 9.x+ compliant). No NFSv3 protocol or listeners.
    # (Protocols are declared centrally in NFS_CORE_PARAM.)

    # VFS FSAL = we are exporting a normal Linux filesystem directory
    # that was bind-mounted into the container from the host.
    FSAL {
        Name = VFS;
    }

    # Per-export perf tunables (generated from nfs-klldap.conf [[shares]]):
    #   PrefRead = 16777216;    # bytes (from cache_profile or raw pref_read)
    #   PrefWrite = 8388608;    # bytes (from cache_profile or raw pref_write)
    #   The recommended source is `cache_profile = "..."` under the [[shares]] entry (WebUI dropdown).
    #   See README "Cache Profiles". Raw TOML can still supply direct pref_* numbers.
    #   (other EXPORT keys like Attr_Expiration_Time etc. can be added via raw TOML)

    # Access control is now in the CLIENT block (generated from the Shares "RW/RO" selector
    # in the WebUI / System Settings). We emit a simple wildcard client for the chosen
    # access_type. SecType remains at the EXPORT level. The Principals line supports
    # hybrid user TGT + client machine keytab auth.
    CLIENT {
        Clients = *;
        Access_Type = RW;
        Principals = "host/*@REALM";
    }

    # Optional: additional CLIENT blocks (for specific networks etc.) can be added
    # manually after the generated one. They will be lost on next regeneration from
    # nfs-klldap.conf (the TOML is the source of truth). First match wins.
    #
    # CLIENT {
    #     Clients = 10.0.0.0/8;
    #     Access_Type = RW;
    # }
    #
    # CLIENT {
    #     Clients = *;
    #     Access_Type = None;   # deny the rest
    # }
}

# You can put multiple EXPORT blocks in one file if you want.
# Most people prefer one file per share for easier management by the tool.