# =============================================================================
# Example of a generated Ganesha EXPORT fragment (for reference only).
#
# Fragments are generated inside the container from nfs-klldap.conf.
# Do not bind-mount exports.d from the host in normal operation.
# =============================================================================
#   docker exec nfs-klldap-host ganesha-ctl remove-export <id>
#
# This is the modern, clean way (no more classic kernel /etc/exports).
# =============================================================================

EXPORT {
    # Stable numeric ID for this export. Used for RemoveExport / management.
    # Choose unique values across all your exports (0-60000 range is fine).
    Export_Id = 1001;

    # The real path *inside the container* where the data lives (for the VFS FSAL).
    # Derived via container_path_for from the share's own host_path + container_root:
    #   first directory component of host_path (after leading /) is the implicit per-share
    #   bind root; the tail is the subpath under container_root.
    # Example: host_path="/media/NVME-RAID/nvme" → internal = "/export/NVME-RAID/nvme"
    # (export_path is used only for the client Pseudo / external name and can be short.)
    # Must be visible via the bind(s) declared in compose / docker run.
    Path = /export/example;

    # The path clients see in the NFSv4 pseudo filesystem.
    # This is what appears after the server name in mount commands.
    # Example: mount ... server.example.com:/example /mnt/test
    Pseudo = /example;

    # Strong Kerberos authentication + privacy (integrity + encryption).
    # Clients mount with: -o sec=krb5p
    SecType = krb5p;

    # Strict NFSv4+ only (Ganesha 9.x+ compliant). No NFSv3 protocol or listeners.
    # (Protocols are declared centrally in NFS_CORE_PARAM.)

    # VFS FSAL = we are exporting a normal Linux filesystem directory
    # that was bind-mounted into the container from the host.
    FSAL {
        Name = VFS;
    }

    # Per-export tunables resolved from the share's cache_profile (or raw pref_*).
    #   PrefRead = ...;
    #   PrefWrite = ...;

    CLIENT {
        Clients = *;
        Access_Type = RW;
        Protocols = 4;
        # 9.6/trixie-specific: explicit to stabilize mount/ACCESS for krb5* creds
        # (Read_Access_Check_Policy = pre; also emitted in EXPORT_DEFAULTS).
        Read_Access_Check_Policy = pre;
    }

    # Manual CLIENT blocks may be added after the generated one in this file.
    # They are not preserved on regeneration.
    #
    # CLIENT {
    #     Clients = 10.0.0.0/8;
    #     Access_Type = RW;
    # }
}

# You can put multiple EXPORT blocks in one file if you want.
# Most people prefer one file per share for easier management by the tool.