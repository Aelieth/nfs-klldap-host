ldap_uri = "ldap://aurora.testlabby.local:3890"

[storage]
container_root = "/export"

[server]
hostname = "aurora.testlabby.local"

[sssd]
ldap_default_bind_dn = "uid=admin,ou=people,dc=testlabby,dc=local"
ldap_default_authtok = "adminpassword123!"
kllldap_ignored_attributes = true

[kerberos]
realm = "TESTLABBY.LOCAL"

[probe]
# user_principal = "someuser"     # sample LDAP user for startup identity checks (auto-picked when unset)
# client_host = "laptop-1"        # enrolled client machine, checked as host/<name>@REALM (auto-picked when unset)

[ganesha]
default_security = "krb5p"

[webui]
tls = false

[[shares]]
name = "stuff"
host_path = "/home/local/Projects/test-nfs-work/stuff"
container_path = "/export/stuff"
pseudo_path = "/stuff"
manage_gids = true
rw = true

[[shares]]
name = "junk"
host_path = "/home/local/Projects/test-nfs-work/junk"
container_path = "/export/junk"
pseudo_path = "/junk"
manage_gids = true
rw = true
