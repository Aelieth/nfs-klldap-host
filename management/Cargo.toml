[package]
name = "management"
version = "0.1.0"
edition = "2021"

# Provide a user-friendly binary name for the host-side management UI.
[[bin]]
name = "nfs-klldap-ui"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
toml = "0.8"
toml_edit = "0.22"   # for comment-preserving structured edits of the central conf
reqwest = { version = "0.12", features = ["rustls-tls", "json"] }

# The single source of truth for nfs-klldap.conf (tiny crate, shared with container generator)
nfs-klldap-config = { path = "nfs-klldap-config" }

# Web UI (Axum + HTMX + Askama)
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["fs", "trace"] }
askama = { version = "0.12", features = ["with-axum"] }
askama_axum = "0.4"

# Minimal local sudo auth (cookie + random tokens + sudo test)
cookie = { version = "0.18", features = ["private"] }
rand = "0.8"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.4", features = ["util"] }  # for ServiceExt in handler tests
urlencoding = "2"
