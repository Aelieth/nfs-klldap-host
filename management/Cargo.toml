[package]
name = "management"
version = "0.5.0"
edition = "2021"

# Provide a user-friendly binary name for the WebUI (runs inside the container).
[[bin]]
name = "nfs-klldap-ui"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
toml = "0.8"
toml_edit = "0.22"   # for comment-preserving structured edits of the central conf
reqwest = { version = "0.12", features = ["rustls-tls", "json"] }

# The single source of truth for nfs-klldap.conf (tiny crate, shared with container generator)
nfs-klldap-config = { path = "nfs-klldap-config" }

# Web UI (Axum + HTMX + Askama)
axum = { version = "0.7", features = ["macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
# Explicit crypto provider for rustls (required for tls-rustls in recent versions)
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tower-http = { version = "0.5", features = ["fs", "trace"] }
askama = { version = "0.12", features = ["with-axum"] }
askama_axum = "0.4"

# Minimal local sudo auth (cookie + random tokens + sudo test)
cookie = { version = "0.18", features = ["private"] }
rand = "0.8"
libc = "0.2"
# For the "localhost" simple admin password sidecar (bcrypt hash, 0600)
bcrypt = "0.15"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.4", features = ["util"] }  # for ServiceExt in handler tests
urlencoding = "2"
