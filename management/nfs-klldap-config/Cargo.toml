[package]
name = "nfs-klldap-config"
version = "0.23.0"
edition = "2021"
description = "Tiny type-safe TOML config loader + generator for nfs-klldap-host (bundled in container)"
license = "MIT OR Apache-2.0"
authors = ["Aelieth"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "nfs-klldap-config"
path = "src/main.rs"

# New startup/orchestration binary.
# This will gradually take over the complex guided setup, reachability testing,
# and runtime diagnostics that currently live in entrypoint.sh (replacing
# fragile grep|cut|tr|sed parsing of the TOML).
[[bin]]
name = "nfs-klldap-startup"
path = "src/bin/nfs_klldap_startup.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"
# thiserror kept out for tiny container binary size; manual error impl below

[dev-dependencies]
tempfile = "3"
