[package]
name = "nfs-perm-helper"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"

# Reuses the authoritative nfs-klldap.conf parser (only the shares allow-list path for TCB minimality).
# The helper loads only host_path entries via load_host_paths_only (no credential requirement).
nfs-klldap-config = { path = "../nfs-klldap-config" }
