{% extends "base.html" %}

{% block content %}
<h2>Managed Directories</h2>

<div id="tree-root"
     hx-get="/tree?path=/media"
     hx-trigger="load"
     hx-swap="innerHTML">
    Loading tree...
</div>

<div id="permission-form" class="form" style="display:none;">
    <!-- Populated by HTMX when a directory is clicked -->
</div>

<script>
    // Simple helper: when a directory is clicked in the tree, load its form
    document.body.addEventListener('click', function(evt) {
        if (evt.target.classList.contains('dir')) {
            const path = evt.target.dataset.path;
            htmx.ajax('GET', '/directory?path=' + encodeURIComponent(path), {target: '#permission-form', swap: 'innerHTML'});
            document.getElementById('permission-form').style.display = 'block';
        }
    });
</script>
{% endblock %}
