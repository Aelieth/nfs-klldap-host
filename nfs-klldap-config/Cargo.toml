[package]
name = "nfs-klldap-config"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Tiny type-safe TOML config loader + generator for nfs-klldap-host (bundled in container)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "nfs-klldap-config"
path = "src/main.rs"

# Startup/orchestration binary (guided first-run TUI + reachability + diagnostics).
[[bin]]
name = "nfs-klldap-startup"
path = "src/bin/nfs_klldap_startup.rs"

# Lightweight always-running ID/Kerberos principal helper (daemon + CLI).
# Classifies machine/root principals vs LDAP user principals, resolves to
# POSIX uid/gid via NSS, and maintains a fast translation for stable NFS mounts.
# Designed to be memory-efficient and in the path for every mount (esp. 4K workloads).
[[bin]]
name = "nfs-klldap-idhelper"
path = "src/bin/nfs_klldap_idhelper.rs"

[dependencies]
serde = { workspace = true }
toml = { workspace = true }
# ldap3 (sync feature) for structured LDAP resolution path used by idhelper.
# Mirrors capabilities (PosixAttributeMapping, filters, reverse caches) from nfs-klldap-ui/src/ldap.rs
# so idhelper/getent/nfsidmap paths do not hammer the server and stay consistent.
# Only affects the idhelper binary; UI already depends on ldap3.
ldap3 = { workspace = true, features = ["sync", "tls-rustls-ring"] }
# thiserror kept out for tiny container binary size; manual error impl below

[dev-dependencies]
tempfile = { workspace = true }
