[package]
name = "nfs-klldap-identity"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Minimal shared LDAP + Kerberos identity resolution for nfs-klldap-host (Ganesha 9.6 hybrid principals)"

[dependencies]
ldap3 = { workspace = true, features = ["sync", "tls-rustls-ring"] }
# Custom-CA verification for LDAPS (shared TLS policy in ldap::tls).
rustls = { workspace = true }
rustls-pemfile = "2.2"
rustls-native-certs = "0.8"

[dev-dependencies]
tempfile = { workspace = true }

[features]
# Env-driven LDAP stubs (TEST_REBULK_POPULATE) for dependent crates' tests; never in release builds.
test-support = []