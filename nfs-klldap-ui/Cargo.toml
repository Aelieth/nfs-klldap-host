[package]
name = "nfs-klldap-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "In-container WebUI (Axum + HTMX) for nfs-klldap-host — edits central TOML and applies live permissions inside the container on port 9630"

# Provide a user-friendly binary name for the WebUI (runs inside the container).
[[bin]]
name = "nfs-klldap-ui"
path = "src/main.rs"

[dependencies]
# --- Shared with nfs-klldap-config (centralized in workspace) -----------------
serde = { workspace = true }
toml = { workspace = true }

# --- Core async runtime ------------------------------------------------------
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync", "time"] }

# --- TOML handling (comment-preserving edits for the central config) ---------
toml_edit = { workspace = true }

# --- Internal workspace crate ------------------------------------------------
nfs-klldap-config = { path = "../nfs-klldap-config" }

# --- Web framework (Axum + HTMX via Askama) ----------------------------------
axum = { workspace = true, features = ["macros"] }
# tls-rustls-no-provider (not tls-rustls) keeps aws-lc-rs out of the graph; the
# ring CryptoProvider is installed at startup in main.rs.
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { workspace = true }
rustls-pemfile = "2.2"
rcgen = { version = "0.14", features = ["pem"] }
askama = { workspace = true, features = ["with-axum"] }
askama_axum = { workspace = true }

# --- HTTP middleware (normalize-path for proxy friendliness; used for reverse-proxy TLS mode) ---
tower-http = { version = "0.5", features = ["normalize-path"] }

# --- Local authentication ----------------------------------------------------
cookie = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }

thiserror = { workspace = true }
time = { workspace = true }  # rcgen::CertificateParams not_before/after (cert generation) + tree file-mtime display

# --- LDAP client for KLLDAP --------------------------------------------------
ldap3 = { workspace = true, features = ["sync", "tls-rustls-ring"] }

# Small, zero-dep URL encoding (already a dev-dep; promoted for safe path interpolation in error fragments)
urlencoding = { workspace = true }

# Filesystem tree walking for safe, policy-driven recursive permission application (follow_links control + filter_entry)
walkdir = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs", "user"] }
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }  # ServiceExt::oneshot in handler tests
urlencoding = { workspace = true }
# Enables the identity resolver's TEST_REBULK_POPULATE offline stubs so the
# periodic-refresh tests can run without a live LDAP server.
nfs-klldap-config = { path = "../nfs-klldap-config", features = ["test-support"] }
