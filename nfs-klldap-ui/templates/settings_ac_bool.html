<div class="fld" data-ac-field="{{ f.name }}" style="margin-top:12px">
  <div class="ac-head">
    <label class="fld-lab" title="{{ f.tooltip }}">{{ f.label }} <span class="ico">i</span></label>
    <div class="seg" data-ac-for="{{ f.name }}">
      <button type="button" data-ac="auto" class="{% if !f.overridden %}on{% endif %}">Auto</button>
      <button type="button" data-ac="custom" class="{% if f.overridden %}on{% endif %}">Custom</button>
    </div>
  </div>
  <label class="chkline"><input type="checkbox" name="{{ f.name }}" id="{{ f.name }}" value="true" {% if f.checked %}checked{% endif %} {% if !f.overridden %}disabled{% endif %}> enabled</label>
  <input type="checkbox" name="override_{{ f.name }}" id="override_{{ f.name }}" value="true" {% if f.overridden %}checked{% endif %} hidden>
</div>
