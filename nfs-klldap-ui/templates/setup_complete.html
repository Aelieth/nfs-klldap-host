<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup complete – NFS Kerb Manager</title>
    <style>
        :root {
            --bg: #ffffff;
            --bg-alt: #f8f9fa;
            --text: #222222;
            --text-light: #666666;
            --accent: #2b7de9;
            --link: #0d6efd;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #222222;
                --bg-alt: #2a2a2a;
                --text: #e1e1e1;
                --text-light: #999999;
                --accent: #5fa8ff;
                --link: #6ea8fe;
            }
        }
        html, body { background: var(--bg); color: var(--text); }
        body {
            font-family: system-ui, sans-serif;
            margin: 2rem auto;
            max-width: 720px;
            line-height: 1.45;
            padding: 0 1rem;
        }
        a { color: var(--link); }
        h1 { font-size: 1.55em; margin: 0 0 0.35em; }
        .status {
            margin: 1rem 0;
            padding: 0.85rem 1rem;
            border: 1px solid var(--text-light);
            border-radius: 4px;
            background: var(--bg-alt);
            font-size: 0.95em;
        }
        .spinner {
            display: inline-block;
            width: 0.95em;
            height: 0.95em;
            border: 2px solid var(--text-light);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
            vertical-align: -0.12em;
            margin-right: 0.4em;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .small { font-size: 0.9em; color: var(--text-light); }
    </style>
</head>
<body>
    <h1>Setup complete</h1>
    <div class="status">
        <span class="spinner"></span>
        <span>Settings successfully saved, loading…</span>
    </div>
    <p class="small">You will be redirected to the login page shortly.</p>
    <p class="small"><a href="/login">Continue to login</a></p>
    <script>
        setTimeout(function () { window.location.href = '/login'; }, 1500);
    </script>
</body>
</html>
