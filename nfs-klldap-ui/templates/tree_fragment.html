<ul class="tree">
{% for child in children %}
    <li>
        <span class="dir"
              data-path="{{ child.path }}"
              style="cursor: pointer; user-select: none;">
            ▶ {{ child.name }}
        </span>
        {# Stable placeholder for JS/HTMX expand (no sibling races). #}
        <div class="children" style="margin-left: 0.75em;"></div>
    </li>
{% endfor %}
</ul>
